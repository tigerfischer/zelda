name: zelda
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # HTTP + config
      - httpx==0.27.2
      - pydantic==2.9.2
      - pydantic-settings==2.6.1
      - python-dotenv==1.0.1
      # Logging + retries
      - loguru==0.7.2
      - tenacity==9.0.0
      # Google clients (Drive + Sheets)
      - gspread==6.1.4
      - google-api-python-client==2.151.0
      - google-auth==2.36.0
      - google-auth-httplib2==0.2.0
      # LLM matching
      - anthropic==0.50.0
      - jinja2==3.1.6
      # Website audit
      - requests==2.32.3
      - beautifulsoup4==4.12.3
      # Headless browser (Google Maps reviews capture)
      - playwright==1.48.0
      # Tests
      - pytest==8.3.3
      - respx==0.21.1
      # Install this package in editable mode
      - -e .
